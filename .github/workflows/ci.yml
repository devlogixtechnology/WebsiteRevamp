name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Priority 1 per CLAUDE.md: build/lint must pass, non-negotiable gate on every PR.
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `next build` runs its own full TypeScript check internally, so a standalone
      # `tsc --noEmit` step here would be redundant — and actively wrong before build has run
      # once: Next.js generates ambient types (e.g. `LayoutProps`) into `.next/types/` as part
      # of build/dev, so `tsc --noEmit` on a fresh checkout with no `.next` dir yet fails with
      # "Cannot find name 'LayoutProps'" even though the code is correct. Confirmed by CI run
      # on PR #7 (see DEVELOPMENT MATERIAL/CI logs/2_lint-and-build.txt) before this fix.
      - run: npm run build

  # The production Docker image builds and actually serves traffic: the container has to become
  # healthy (Dockerfile HEALTHCHECK -> /api/v1/health), render the homepage, and optimize an
  # image (proves sharp's native binary made it into the slim runner stage).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t devlogix-web:ci .
      - name: Start container
        run: docker run -d --name web -p 3000:3000 devlogix-web:ci
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' web)" = "healthy" ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' web)" = "healthy"
          curl -fsS http://localhost:3000/api/v1/health
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -o /dev/null "http://localhost:3000/_next/image?url=%2Fimages%2Fhome%2Fcta-form.jpg&w=640&q=75"
      - name: Container logs
        if: failure()
        run: docker logs web

  # Priority 3: component smoke tests (Storybook stories via the vitest addon) + Priority 5:
  # accessibility (axe-core runs as part of those same stories, see .storybook/preview.tsx).
  # Also runs the plain-Node unit tests (src/**/*.test.ts) as the same `vitest run` invocation.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # Priority 2: E2E — homepage loads, nav links resolve, contact/careers forms submit and
  # validate correctly. Priority 4: responsive viewport checks. Priority 5: axe-core per page.
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
